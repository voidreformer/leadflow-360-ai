<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Multi-stop Gradient using User Palette: #A961FF (Purple), #FFBD61 (Amber), #60FF8C (Mint) -->
    <linearGradient id="lfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A961FF" />
      <stop offset="50%" stop-color="#FFBD61" />
      <stop offset="100%" stop-color="#60FF8C" />
    </linearGradient>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="500" height="500" rx="100" fill="url(#bgGrad)" />
  <rect width="480" height="480" x="10" y="10" rx="90" fill="none" stroke="url(#lfGrad)" stroke-width="4" stroke-opacity="0.5" />

  <!-- Outer 360-Degree Glowing Funnel Arc -->
  <circle cx="250" cy="220" r="140" fill="none" stroke="url(#lfGrad)" stroke-width="16" stroke-linecap="round" stroke-dasharray="700 150" filter="url(#glow)" />

  <!-- Inner Dynamic Lead Nodes -->
  <path d="M170 170 Q 250 110 330 170 T 250 310 Z" fill="none" stroke="#60FF8C" stroke-width="12" stroke-linejoin="round" />

  <!-- Central High-Intent Node Core -->
  <circle cx="250" cy="220" r="32" fill="url(#lfGrad)" filter="url(#glow)" />
  <circle cx="250" cy="220" r="14" fill="#FFFFFF" />

  <!-- Typography: LEADFLOW 360 AI -->
  <text x="250" y="405" font-family="'Inter', sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">LEADFLOW 360</text>
  <text x="250" y="442" font-family="'Inter', sans-serif" font-weight="800" font-size="18" fill="#60FF8C" text-anchor="middle" letter-spacing="4">BY VOIDREFORMER</text>
</svg>
